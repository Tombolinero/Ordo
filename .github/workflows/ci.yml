name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**", "develop"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit & screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (JVM, Robolectric, migrations, backup)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Screenshot tests (compare against committed images)
        run: ./gradlew verifyRoborazziDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload test reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/outputs/roborazzi/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ordo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
