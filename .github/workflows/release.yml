name: Release

# Releases happen automatically when main gets a new version in CHANGELOG.md:
# the first "## X.Y.Z" heading is the version. If tag vX.Y.Z already exists, nothing
# happens. A manual run (Actions → Release → Run workflow) can still pass a version.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (HAUPT.NEBEN.FIX), leer = aus CHANGELOG.md"
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Decide version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: v
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          VERSION="$INPUT"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 -oE '^## [0-9]+\.[0-9]{1,2}\.[0-9]{1,2}' CHANGELOG.md | sed 's/^## //')
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Keine gültige Version gefunden (oberste Überschrift in CHANGELOG.md muss '## HAUPT.NEBEN.FIX' sein)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Version $VERSION ist schon veröffentlicht – nichts zu tun."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            echo "::error::$VERSION ist nicht neuer als die letzte Version $latest"; exit 1
          fi
          echo "Veröffentliche Version $VERSION"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build, sign and publish
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ORDO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret ORDO_KEYSTORE_BASE64 fehlt. Siehe docs/RELEASING.md"; exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        env:
          KS: ${{ secrets.ORDO_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ordo-release.jks"
          echo "ORDO_KEYSTORE_PATH=$RUNNER_TEMP/ordo-release.jks" >> "$GITHUB_ENV"

      - name: Verify signing key
        env:
          STORE_PW: ${{ secrets.ORDO_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ORDO_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ORDO_KEY_PASSWORD }}
        run: |
          # Checks the four secrets against each other and says precisely what is wrong,
          # without ever printing a secret.
          KS="$ORDO_KEYSTORE_PATH"
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PW" > /dev/null 2>&1; then
            echo "::error::ORDO_KEYSTORE_PASSWORD passt nicht zum Schlüssel (oder ORDO_KEYSTORE_BASE64 ist unvollständig kopiert). Siehe docs/RELEASING.md."; exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PW" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::ORDO_KEY_ALIAS stimmt nicht. Im Schlüssel vorhandene Aliase: $(keytool -list -keystore "$KS" -storepass "$STORE_PW" | grep -oE '^[^,]+, ' | tr -d ', ' | tr '\n' ' ')"; exit 1
          fi
          # PKCS12: the key password must equal the store password.
          if ! keytool -exportcert -keystore "$KS" -storepass "$STORE_PW" -alias "$ALIAS" > /dev/null 2>&1 || [ "$KEY_PW" != "$STORE_PW" ]; then
            echo "::error::ORDO_KEY_PASSWORD muss genau dasselbe Passwort sein wie ORDO_KEYSTORE_PASSWORD."; exit 1
          fi
          echo "Signatur-Schlüssel und Secrets passen zusammen."

      - name: Test
        run: ./gradlew testDebugUnitTest verifyRoborazziDebug -Pordo.version="$VERSION"

      - name: Build signed release APK
        env:
          ORDO_KEYSTORE_PASSWORD: ${{ secrets.ORDO_KEYSTORE_PASSWORD }}
          ORDO_KEY_ALIAS: ${{ secrets.ORDO_KEY_ALIAS }}
          ORDO_KEY_PASSWORD: ${{ secrets.ORDO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Pordo.version="$VERSION"

      - name: Verify signature and collect APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/Ordo-v$VERSION.apk"
          (cd dist && sha256sum "Ordo-v$VERSION.apk" > "Ordo-v$VERSION.apk.sha256")

      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Ordo $VERSION"
          git push origin "v$VERSION"
          notes=$(awk -v v="## $VERSION" '$0 ~ "^## " {p = index($0, v) == 1} p' CHANGELOG.md | tail -n +2)
          [ -z "$notes" ] && notes="Ordo $VERSION"
          gh release create "v$VERSION" dist/* --title "Ordo $VERSION" --notes "$notes"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ordo-release.jks"
